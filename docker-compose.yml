services:
  db:
    image: postgres:16-alpine
    container_name: comuna-sport-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: comuna_sport
      POSTGRES_USER: comuna
      POSTGRES_PASSWORD: comuna
    ports:
      # Host port 5434 on purpose: 5432 is the local PostgreSQL service and 5433 is
# already published by another project's container.
      - "5434:5432"
    volumes:
      - comuna_sport_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comuna -d comuna_sport"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  comuna_sport_pgdata:
